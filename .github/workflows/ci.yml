name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron downloads its binary on first use, with no time limit; here it gets its own short limit and one
      # more try, so a slow download is not mistaken for a stuck test.
      - name: Electron binary
        id: electron
        timeout-minutes: 4
        continue-on-error: true
        run: node -e "require('electron')"
      - name: Electron binary (second try)
        if: steps.electron.outcome == 'failure'
        timeout-minutes: 4
        run: node -e "require('electron')"
      - name: Linux display and Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Unit and integration tests
        run: node scripts/test.mjs
      - name: Build
        run: node scripts/build.mjs --no-bump
      - name: Editor in Common's shell (headless Chrome)
        timeout-minutes: 10
        run: node scripts/test-common-headless.mjs && node scripts/test-inheritance.mjs
      - name: Electron smoke (hidden windows)
        # The real app with Common's host: start, frames, save/open .eslx, ESF/PPTX imports, exports, Present, drafts.
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/smoke-electron.mjs; else node scripts/smoke-electron.mjs; fi
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
