name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N, a pre-release) builds, signs and stages the installers in a draft release.
# package.json must already hold X.Y.Z; the tag's pre-release suffix is applied only inside the build.
# Pull requests that touch packaging build the installers too, without signing secrets or publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: [electron-builder.yml, build/**, scripts/package.mjs, scripts/public-installers.mjs, scripts/build.mjs, package.json, package-lock.json, .github/workflows/release.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo "version=$pkg" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag="${GITHUB_REF_NAME#v}"; base="${tag%%-*}"
          if [ "$base" != "$pkg" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg)"; exit 1; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mac, os: macos-latest, args: --universal}
          - {name: win, os: windows-latest, args: --x64}
          - {name: linux-x64, os: ubuntu-latest, args: --x64}
    runs-on: ${{ matrix.os }}
    # Signing secrets live in this environment; protect it with required reviewers in the repository settings.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    timeout-minutes: 60
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        shell: bash
        run: node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.version='${{ needs.check.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Without a certificate, macOS builds are signed ad hoc (Gatekeeper will warn)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT != 'true'
        run: echo "BUILDER_ARGS=-c.mac.identity=- -c.mac.hardenedRuntime=false" >> "$GITHUB_ENV"
      # Developer ID signing (CSC_LINK takes the base64 .p12) and notarization (APPLE_API_KEY is the .p8 path).
      # Only on macOS: electron-builder would otherwise try the .p12 for Windows signing.
      - name: Signing and notarization credentials
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"; echo "$API_KEY" | base64 --decode > "$key"
          { echo "CSC_LINK=$P12"; echo "CSC_KEY_PASSWORD=$P12_PASSWORD"; echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"; echo "APPLE_API_ISSUER=$API_ISSUER"; } >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT == 'true' }}
        run: node scripts/package.mjs --no-bump ${{ matrix.args }} $BUILDER_ARGS
      - name: Check universal Mac executable
        if: runner.os == 'macOS'
        run: lipo -verify_arch x86_64 arm64 "release/mac-universal/Edukors Slides Editor.app/Contents/MacOS/Edukors Slides Editor"
      - name: Check signature and notarization
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        run: |
          shopt -s failglob
          for app in release/mac*/*.app; do codesign --verify --deep --strict "$app" && xcrun stapler validate "$app" && spctl -a -vv -t exec "$app" || exit 1; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7
      - name: Microsoft Store packages (uploaded by hand to Partner Center)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix
          path: release/*.appx
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: files
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Public installer names (keep updater originals)
        run: node scripts/public-installers.mjs files "${{ needs.check.outputs.version }}"
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; if [ "${{ needs.check.outputs.prerelease }}" = true ]; then pre="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" files/* -R "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "Edukors Slides Editor ${{ needs.check.outputs.version }}" --generate-notes
