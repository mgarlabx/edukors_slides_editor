# Screenshots for the Microsoft Store listing, taken on Windows (the Store refuses images of other systems), in the
# three interface languages, from a sample class (scripts/store-sample.ts). Run by hand: Actions → Store screenshots →
# Run workflow (or see a pull request that changes it); the images are in the run's "store-screenshots" artifact. No real AI account is used.
name: Store screenshots

on:
  workflow_dispatch:
  # Also on pull requests that change how the screenshots are made, so their result can be checked there.
  pull_request:
    paths: [scripts/store-sample.ts, scripts/store-screenshots.mjs, .github/workflows/store-screenshots.yml]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Electron binary
        timeout-minutes: 4
        run: node -e "require('electron')"
      - name: Display size
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build
        run: node scripts/build.mjs --no-bump
      - name: Screenshots
        timeout-minutes: 10
        run: node scripts/store-screenshots.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-screenshots
          path: test-results/store-screenshots/*/*.png
          retention-days: 30
