<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Edukors</title>
    <link rel="stylesheet" href="r.css?v=1">
    <script type="module" src="r.js?v=1"></script>
</head>
<body>
    <main class="r-main">
        <header class="r-header"><img class="r-logo" src="logo.png" alt="Edukors" width="550" height="210"></header>
        <section class="r-panel" id="r-wait" hidden>
            <p class="r-message" id="r-wait-text"></p>
            <button class="r-secondary" id="r-wait-retry" type="button"></button>
        </section>
        <section class="r-panel" id="r-quiz" hidden>
            <p class="r-hint" id="r-quiz-hint"></p>
            <div class="r-options" id="r-options"></div>
        </section>
        <form class="r-panel" id="r-text" hidden>
            <label class="r-hint" for="r-text-input" id="r-text-hint"></label>
            <textarea class="r-textarea" id="r-text-input" rows="5" maxlength="500"></textarea>
            <button class="r-primary" id="r-text-send" type="submit"></button>
        </form>
        <section class="r-panel" id="r-done" hidden>
            <div class="r-check" aria-hidden="true">✓</div>
            <p class="r-message" id="r-done-text"></p>
        </section>
        <p class="r-error" id="r-error" role="alert"></p>
    </main>
</body>
</html>
