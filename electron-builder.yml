# Installers for macOS, Windows and Linux. Local: node scripts/package.mjs; releases: .github/workflows/release.yml.
appId: org.edukors.slides
productName: Edukors Slides Editor
copyright: Copyright © 2026 Edukors
directories:
  output: release
  buildResources: build
# dist/ already bundles React, fflate and electron-updater; nothing from node_modules goes in.
files:
  - dist/main.cjs
  - dist/preload.cjs
  - dist/ui.js
  - dist/ui.css
  - dist/index.html
  - package.json
asar: true
npmRebuild: false
afterPack: build/after-pack.cjs
fileAssociations:
  - ext: esf
    name: Edukors Slides Editor Presentation
    description: Edukors Slides Editor Presentation
    mimeType: application/vnd.edukors.slides+zip
    role: Editor
    rank: Owner
publish:
  provider: github
  owner: mgarlabx
  repo: edukors_slides_editor

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Edukors-Slides-Editor-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: org.edukors.slides.esf
        UTTypeDescription: Edukors Slides Editor Presentation
        UTTypeConformsTo: [public.zip-archive, public.data]
        UTTypeTagSpecification:
          public.filename-extension: [esf, ESF]
          public.mime-type: [application/vnd.edukors.slides+zip]
dmg:
  artifactName: Edukors-Slides-Editor-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: appx
      arch: [x64]
  artifactName: Edukors-Slides-Editor-${version}-setup.${ext}
# Microsoft Store package (MSIX), one per architecture; the Store signs it. Identity from Partner Center → Product identity.
# Tiles in build/appx/ come from scripts/raster-icon.swift. Uploaded by hand to Partner Center, not to GitHub Releases.
appx:
  identityName: mgarlabx.EdukorsSlidesEditor
  publisher: CN=25CB0A95-E013-4D6C-9667-81DF1CC50F46
  publisherDisplayName: mgarlabx
  displayName: Edukors Slides Editor
  applicationId: EdukorsSlidesEditor
  backgroundColor: transparent
  languages: [en-US, pt-BR, es-ES]
  # The Store takes MSIX packages only for Windows above 10.0.17134 (1803); Electron needs Windows 10 anyway.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: Edukors-Slides-Editor-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  executableName: edukors-slides-editor
  synopsis: Desktop editor for HTML presentations
  maintainer: Edukors
  artifactName: Edukors-Slides-Editor-${version}-linux-${arch}.${ext}
